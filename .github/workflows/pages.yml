name: Deploy course site to GitHub Pages

# 每次 push 到 main 就重建課程站台並部署到 GitHub Pages。
# 需求：repo 為 public（或付費方案），且 Settings → Pages → Source 設為「GitHub Actions」。
on:
  push:
    branches: [main]
    paths:
      - "course/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  pull_request:
    paths:
      - "course/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

# 同時只跑一個部署；新 push 取消進行中的舊部署
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r course/requirements.txt

      - name: Setup Node for navigation tests
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test build pipeline
        run: python -m unittest discover -s course/tests -v

      - name: Build course site
        working-directory: course
        env:
          EMBED: "0"
        run: |
          python build_html.py
          python build_site.py
          python build_pages.py
          python validate_site.py

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: course/_pages

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
